; SABITECH WEB · ajustes de PHP para el contenedor back
expose_php = Off
memory_limit = 256M
upload_max_filesize = 4M
post_max_size = 8M
max_execution_time = 30
date.timezone = UTC

; Errores al log, nunca en la respuesta
display_errors = Off
log_errors = On

; Opcache para producción
opcache.enable = 1
opcache.memory_consumption = 128
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0

; Cookies de sesión seguras (Laravel también lo configura)
session.cookie_httponly = 1
session.cookie_secure = 1
session.use_strict_mode = 1
