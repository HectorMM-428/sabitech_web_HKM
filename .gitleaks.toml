# Valores de prueba conocidos y públicos (no son secretos): clave de aplicación de los
# tests, contraseñas de la base de datos de CI y cuentas ficticias de laboratorio.
[extend]
useDefault = true

[allowlist]
description = "Valores de prueba documentados"
paths = [
  '''backend/phpunit\.xml''',
  '''\.github/workflows/ci\.yml''',
]
regexes = [
  '''base64:A{43}=''',
  '''local-test-only''',
  # Contraseña de las cuentas ficticias que crean las pruebas automáticas (RefreshDatabase).
  '''Clave-segura-2026''',
  # Nombre de variable de configuración, no un secreto (duración del QR en segundos).
  '''QR_TTL_SECONDS=\d+''',
]
